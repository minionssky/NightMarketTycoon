name: Verify NightMarket core and UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Record WeChat readiness (not a build)
        shell: bash
        run: |
          mkdir -p artifacts/phase4
          status=0
          node scripts/wechat-preflight.mjs > artifacts/phase4/wechat-readiness.json || status=$?
          test "$status" -eq 0 -o "$status" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-demo
          path: artifacts/
